[package]
name = "receiver-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["soapy"]
soapy = []
# Built-in RTL-SDR driver over USB (Android: device fd from the app).
usb = ["dep:rtlsdr-nusb"]
# Frame encoders for development tools such as the demodulator evaluator.
# The receiver never encodes frames; release builds leave this off.
synthesis = []

[dependencies]
jr_conventional_dsp = { path = "../jr-conventional-dsp" }
jr_conventional_voice = { path = "../jr-voice" }
rtlsdr-nusb = { path = "../rtlsdr-nusb", optional = true }
serde.workspace = true
serde_json.workspace = true
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
pkg-config = "0.3"

[package]
name = "receiver-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["soapy"]
soapy = []
# Use the v1.3 voice decoder (about 20x lighter). Enabled by the Android app.
lite-voice = ["dep:jr_conventional_voice_lite"]

[dependencies]
jr_conventional_dsp = { path = "../jr-conventional-dsp" }
jr_conventional_voice = { path = "../jr-voice" }
jr_conventional_voice_lite = { path = "../jr-voice-lite", optional = true }
serde.workspace = true
serde_json.workspace = true
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
pkg-config = "0.3"

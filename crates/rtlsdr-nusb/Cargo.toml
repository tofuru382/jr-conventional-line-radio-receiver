# Vendored from rtlsdr-nusb 0.3.0 (https://github.com/bastibl/rtlsdr-nusb,
# Apache-2.0, see LICENSE). JR-CLRR changes, marked "JR-CLRR" in the source:
# - accept librtlsdr's low sample-rate range 225001..=300000 (the receiver
#   captures at 240 kS/s), and
# - DeviceBuilder::open_fd: open from an OS-provided USB file descriptor, which
#   is how Android apps get USB access (built-in dongle driver, no driver app),
# - librtlsdr's tuner IF bandwidth (r82xx_set_bandwidth) and IF per sample
#   rate, so a 240 kS/s capture is not flooded by aliased signals, and
# - the real low-range sample rate (bit 27 of the ratio sign-extends),
# - librtlsdr's 16 MHz tuner crystal for an R828D that is not a Blog V4, with
#   the R828D PLL integer limit of 127 it needs, and
# - librtlsdr's 15 transfers in flight instead of 8,
# - the last transfer error in StreamingStats, for diagnosis, and
# - librtlsdr's tolerance of transient transfer errors: a failed transfer is
#   counted as dropped and resubmitted; the stream ends only when the device
#   is gone or as many transfers fail in a row as are in flight.
[package]
name = "rtlsdr-nusb"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[features]
default = []

[dependencies]
nusb = "0.2.7"
num-complex = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-lite = "2"

[dev-dependencies]
futures-lite = "2"

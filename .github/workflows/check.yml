name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-check
      - uses: ./.github/actions/setup-native
      - run: npm ci
      - name: Check Rust, UI, and release metadata
        run: |
          set -o pipefail
          bash scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/check.log"
      # The error lines as an annotation, readable without downloading logs.
      - name: Report check errors
        if: failure()
        run: |
          lines=$(grep -E -A4 '^(error|warning)(\[[A-Za-z0-9_]+\])?:|panicked at|^---- |^failures:|^not ok|FAILED' "$RUNNER_TEMP/check.log" | head -100 || true)
          message=$(printf '%s' "$lines" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=scripts/check.sh::${message:-no error lines found}"
